[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-forecasting"
version = "0.1.0"
description = "Forecasting utilities for transit data"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python",
    "numpy",
    "pandas",
    "plotly>=5.24",
    "shapely",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["forecasting"]
