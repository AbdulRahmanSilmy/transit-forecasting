x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    logging: *default-logging
    image: mysql:8.0
    container_name: transit_mysql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    # Binary logs only serve replication/point-in-time recovery, which this
    # single-node setup does not use; with MySQL's 30-day default they grew
    # to several GB on the Raspberry Pi SD card.
    command: --default-authentication-plugin=mysql_native_password --skip-log-bin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  phpmyadmin:
    logging: *default-logging
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  data_ingestion:
    logging: *default-logging
    build: .
    container_name: data_ingestion
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy

  integration_tests:
    logging: *default-logging
    build: .
    profiles: ["test"]
    env_file:
      - ./.env
    environment:
      RUN_INTEGRATION_TESTS: "1"
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir .[test] &&
      pytest tests/integration/test_mysql_ingestion.py -q"

volumes:
  mysql_data:
